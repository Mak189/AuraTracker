<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>AuraTracker</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #111;
      color: #eee;
    }

    video,
    canvas {
      border: 2px solid #555;
      border-radius: 12px;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <h1>AuraTracker - Emotion Detection</h1>
  <video id="video" autoplay playsinline></video>
  <canvas id="output"></canvas>
  <p id="emotion">Emotion: ...</p>

  <!-- MediaPipe scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

  <script>
    const videoElement = document.getElementById('video');
    const canvasElement = document.getElementById('output');
    const canvasCtx = canvasElement.getContext('2d');
    const emotionText = document.getElementById('emotion');

    // 1️⃣ Create FaceMesh first
    const faceMesh = new FaceMesh.FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    // 2️⃣ Define what happens when FaceMesh returns results
    faceMesh.onResults((results) => {
      canvasElement.width = videoElement.videoWidth;
      canvasElement.height = videoElement.videoHeight;

      canvasCtx.drawImage(results.image, 0, 0);

      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        emotionText.textContent = "Face detected!";
      } else {
        emotionText.textContent = "No face detected";
      }
    });

    // 3️⃣ Setup Camera AFTER faceMesh is defined
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await faceMesh.send({image: videoElement});
      },
      width: 640,
      height: 480
    });
    camera.start();
  </script>
</body>

</html>
